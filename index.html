<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Head Mode — Face GIF Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1423;--cream:#fff3d6;--pink:#ff4f8b;--yellow:#ffd23f;--teal:#2ec4b6;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;
  background-image:radial-gradient(#f7d397 1.5px,transparent 1.6px);background-size:22px 22px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;margin:10px 0 24px}
h1{font-weight:800;font-size:clamp(42px,10vw,76px);line-height:.95;margin:0;letter-spacing:-.03em}
h1 .big{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:0 .14em .04em;
  box-shadow:5px 5px 0 var(--ink);animation:wob 2.4s ease-in-out infinite;transform:rotate(-3deg)}
@keyframes wob{50%{transform:rotate(3deg) scale(1.05)}}
@media (prefers-reduced-motion:reduce){h1 .big{animation:none}}
.sub{font-size:18px;margin:16px 0 0;opacity:.8}
.grid{display:grid;gap:22px}
@media(min-width:880px){.grid{grid-template-columns:1fr 1.08fr;align-items:start}.preview-card{position:sticky;top:16px}}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:18px}
.card h2{margin:0 0 14px;font-size:23px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.num{width:32px;height:32px;flex:none;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:17px;border:2.5px solid var(--ink)}
.btn{font:inherit;font-weight:800;font-size:17px;border:3px solid var(--ink);border-radius:14px;padding:12px 18px;background:var(--yellow);
  color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;
  transition:transform .08s,box-shadow .08s;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn.ghost{background:#fff;font-size:15px;padding:8px 14px;box-shadow:3px 3px 0 var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.6;cursor:progress}
.editor-box{width:100%;max-width:340px;margin:16px auto 8px;aspect-ratio:1}
#editor{width:100%;height:100%;border-radius:16px;border:3px solid var(--ink);touch-action:none;cursor:grab;background:#2a2333;display:block}
#editor:active{cursor:grabbing}
.hint{font-size:14px;opacity:.7;text-align:center;margin:6px 0 12px}
.slider{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:10px;margin:8px 0;font-weight:600;font-size:15px}
input[type=range]{width:100%;accent-color:var(--pink);height:28px}
.err{color:#c4002f;font-weight:600;text-align:center;font-size:14px;min-height:0;margin:8px 0 0}
#preview{width:100%;max-width:400px;aspect-ratio:1;display:block;margin:0 auto;border-radius:16px;border:3px solid var(--ink);background:#000}
.bits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.bit{font:inherit;color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:8px 2px 7px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:12.5px;line-height:1.1;-webkit-tap-highlight-color:transparent}
.bit .e{font-size:25px;line-height:1}
.bit[aria-pressed=true]{background:var(--teal);box-shadow:3px 3px 0 var(--ink);transform:translate(-2px,-2px)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.fields{grid-template-columns:1fr}}
label.field{display:block;font-weight:600;font-size:15px;margin:10px 0 4px}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fffdf6;color:var(--ink)}
input[type=text]:focus{outline:3px solid var(--yellow);outline-offset:1px}
.make{margin-top:16px}
.progress{height:16px;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff;margin-top:14px;display:none}
.progress>div{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--pink) 0 10px,#ff7aa8 10px 20px)}
#result{display:none;margin-top:18px;text-align:center;border-top:3px dashed var(--ink);padding-top:18px}
#result h3{margin:0 0 12px;font-size:20px}
#out{width:100%;max-width:400px;border-radius:16px;border:3px solid var(--ink);display:block;margin:0 auto}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.small{font-size:14px;opacity:.75;margin:10px 0 0}
footer{text-align:center;margin-top:30px;font-size:14px;opacity:.7}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="big">Big Head</span> Mode</h1>
    <p class="sub">Put your friend's face in a ridiculous looping GIF.</p>
  </header>

  <div class="grid">
    <section class="card">
      <h2><span class="num">1</span> Grab their face</h2>
      <label class="btn pink block" for="file">📸 Choose a photo</label>
      <input id="file" type="file" accept="image/*" class="vh">
      <p class="err" id="err"></p>
      <div class="editor-box"><canvas id="editor" width="600" height="600" aria-label="Drag to position the face inside the oval"></canvas></div>
      <p class="hint">Drag to move · pinch or slide to zoom · fit the face in the oval</p>
      <div class="slider"><label for="zoom">Zoom</label><input id="zoom" type="range" min="-1.5" max="3.2" step="0.01" value="0"></div>
      <div class="slider"><label for="tilt">Tilt</label><input id="tilt" type="range" min="-45" max="45" step="1" value="0"></div>
      <div class="slider"><label for="eye">Eye line</label><input id="eye" type="range" min="0.2" max="0.7" step="0.01" value="0.42"></div>
      <div class="row"><button class="btn ghost" id="reset" type="button">↺ Reset position</button></div>
    </section>

    <section class="card preview-card">
      <h2><span class="num">2</span> Pick the bit</h2>
      <canvas id="preview" width="360" height="360" aria-label="Live preview"></canvas>
      <div class="bits" id="bits" role="group" aria-label="Animation"></div>
      <div class="fields">
        <div><label class="field" for="top">Top text</label><input id="top" type="text" maxlength="60" placeholder="optional"></div>
        <div><label class="field" for="bottom">Bottom text</label><input id="bottom" type="text" maxlength="60" placeholder="optional"></div>
      </div>
      <div class="slider" style="margin-top:12px"><label for="speed">Speed <span id="speedv">1×</span></label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"></div>
      <button class="btn pink block make" id="make" type="button">✨ Make the GIF</button>
      <div class="progress" id="prog"><div></div></div>
      <div id="result">
        <h3>Here it is 🎉</h3>
        <img id="out" alt="Your finished GIF">
        <div class="row"><button class="btn" id="save" type="button" hidden>⬇️ Save GIF</button><button class="btn" id="share" type="button" hidden>📤 Share</button></div>
        <p class="small" id="savehint"></p>
      </div>
    </section>
  </div>

  <footer>Everything runs in your browser — the photo never leaves your device.<br>Best used on friends who are in on the joke 😄</footer>
</div>

<script>
(() => {
const TAU = Math.PI * 2, W = 360;
const $ = id => document.getElementById(id);
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const ed = $('editor'), ectx = ed.getContext('2d');
const pv = $('preview'), pctx = pv.getContext('2d');

/* ---------- face source ---------- */
function makePlaceholder() {
  const c = document.createElement('canvas'); c.width = c.height = 600;
  const g = c.getContext('2d');
  g.fillStyle = '#f2b98a'; g.fillRect(0, 0, 600, 600);
  g.fillStyle = '#4a2c1d'; g.beginPath(); g.ellipse(300, 120, 230, 95, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(170, 170, 60, 70, -.4, 0, TAU); g.fill();
  g.fillStyle = '#ff9a9a'; [[205, 340], [395, 340]].forEach(([x, y]) => { g.beginPath(); g.ellipse(x, y, 34, 22, 0, 0, TAU); g.fill(); });
  [[240, 268], [360, 268]].forEach(([x, y], i) => {
    g.fillStyle = '#fff'; g.beginPath(); g.ellipse(x, y, 30, 34, 0, 0, TAU); g.fill();
    g.fillStyle = '#1a1423'; g.beginPath(); g.arc(x + (i ? -6 : 6), y + 4, 15, 0, TAU); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x + (i ? -1 : 11), y - 2, 5, 0, TAU); g.fill();
  });
  g.strokeStyle = '#4a2c1d'; g.lineWidth = 12; g.lineCap = 'round';
  g.beginPath(); g.moveTo(205, 215); g.quadraticCurveTo(240, 195, 272, 212); g.stroke();
  g.beginPath(); g.moveTo(328, 205); g.quadraticCurveTo(362, 190, 395, 215); g.stroke();
  g.fillStyle = '#7a1f2b'; g.beginPath(); g.moveTo(225, 365); g.quadraticCurveTo(300, 470, 375, 365); g.closePath(); g.fill();
  g.fillStyle = '#fff'; g.fillRect(245, 365, 110, 16);
  g.strokeStyle = '#c47b52'; g.lineWidth = 8; g.beginPath(); g.moveTo(300, 290); g.lineTo(290, 325); g.lineTo(308, 328); g.stroke();
  return c;
}
let src = makePlaceholder();
const st = { ox: 0, oy: 0, zoom: 1, rot: 0, eye: 0.42 };
let baseScale = 1;
const fitBase = () => { baseScale = Math.max(600 / src.width, 600 / src.height); };
fitBase();

function drawSrc(c, cx, cy) {
  c.translate(cx + st.ox, cy + st.oy); c.rotate(st.rot);
  const s = baseScale * st.zoom; c.scale(s, s);
  c.drawImage(src, -src.width / 2, -src.height / 2);
}

function drawEditor() {
  const c = ectx;
  c.fillStyle = '#2a2333'; c.fillRect(0, 0, 600, 600);
  c.save(); drawSrc(c, 300, 300); c.restore();
  c.save(); c.fillStyle = 'rgba(26,16,36,.62)'; c.beginPath(); c.rect(0, 0, 600, 600);
  c.ellipse(300, 300, 140, 200, 0, 0, TAU); c.fill('evenodd'); c.restore();
  c.lineWidth = 5; c.setLineDash([18, 12]); c.strokeStyle = '#ffd23f';
  c.beginPath(); c.ellipse(300, 300, 140, 200, 0, 0, TAU); c.stroke();
  const ey = 100 + st.eye * 400;
  c.setLineDash([10, 8]); c.lineWidth = 3; c.strokeStyle = '#2ec4b6';
  c.beginPath(); c.moveTo(140, ey); c.lineTo(460, ey); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#2ec4b6'; c.font = '600 24px "Bricolage Grotesque", sans-serif'; c.textAlign = 'left';
  c.fillText('eyes', 470, ey + 8);
}

const face = document.createElement('canvas'); face.width = face.height = 400;
function updateFace() {
  const c = face.getContext('2d');
  c.clearRect(0, 0, 400, 400);
  c.save(); drawSrc(c, 200, 200); c.restore();
  c.save(); c.globalCompositeOperation = 'destination-in';
  c.translate(200, 200); c.scale(1, 200 / 140);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 140);
  g.addColorStop(0, '#000'); g.addColorStop(.9, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(-200, -240, 400, 480); c.restore();
}
function refresh() { drawEditor(); updateFace(); }

function drawFace(c, x, y, h, rot = 0, sx = 1, sy = 1, img = face) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(sx, sy);
  c.drawImage(img, -h / 2, -h / 2, h, h); c.restore();
}

/* ---------- editor interaction ---------- */
const zoomIn = $('zoom'), tiltIn = $('tilt'), eyeIn = $('eye');
const syncSliders = () => { zoomIn.value = Math.log2(st.zoom); tiltIn.value = Math.round(st.rot * 180 / Math.PI); eyeIn.value = st.eye; };
zoomIn.oninput = () => { st.zoom = Math.pow(2, +zoomIn.value); refresh(); };
tiltIn.oninput = () => { st.rot = +tiltIn.value * Math.PI / 180; refresh(); };
eyeIn.oninput = () => { st.eye = +eyeIn.value; refresh(); };
function resetView() { fitBase(); st.ox = st.oy = 0; st.zoom = 1; st.rot = 0; syncSliders(); refresh(); }
$('reset').onclick = resetView;

const pts = new Map();
const clampZoom = z => Math.min(Math.pow(2, 3.2), Math.max(Math.pow(2, -1.5), z));
ed.addEventListener('pointerdown', e => { ed.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
ed.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId), k = ed.width / ed.getBoundingClientRect().width;
  if (pts.size === 1) {
    st.ox += (e.clientX - prev.x) * k; st.oy += (e.clientY - prev.y) * k;
  } else if (pts.size === 2) {
    const other = [...pts.entries()].find(([id]) => id !== e.pointerId)[1];
    const d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(e.clientX - other.x, e.clientY - other.y);
    if (d0 > 4) { const nz = clampZoom(st.zoom * d1 / d0), r = nz / st.zoom; st.ox *= r; st.oy *= r; st.zoom = nz; }
  }
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  syncSliders(); refresh();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => ed.addEventListener(n, e => pts.delete(e.pointerId)));
ed.addEventListener('wheel', e => {
  e.preventDefault(); const nz = clampZoom(st.zoom * Math.exp(-e.deltaY * 0.0015)), r = nz / st.zoom;
  st.ox *= r; st.oy *= r; st.zoom = nz; syncSliders(); refresh();
}, { passive: false });

$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  $('err').textContent = '';
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const s = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    src = c; URL.revokeObjectURL(url); resetView();
  };
  im.onerror = () => { URL.revokeObjectURL(url); $('err').textContent = "Couldn't read that photo — try a JPG or PNG."; };
  im.src = url;
  e.target.value = '';
});

/* ---------- animation templates ---------- */
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function line(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
const tint = document.createElement('canvas'); tint.width = tint.height = 400;

const TEMPLATES = [
{ id: 'bobble', name: 'Bobble­head', e: '🤪', frames: 30, draw(c, t) {
  const g = c.createLinearGradient(0, 0, 0, W); g.addColorStop(0, '#79d5ff'); g.addColorStop(1, '#dcf7ff');
  c.fillStyle = g; c.fillRect(0, 0, W, W);
  c.fillStyle = '#fff';
  for (let i = 0; i < 3; i++) { const x = ((rnd(i) + t) % 1) * (W + 170) - 85, y = 40 + i * 55;
    [[-26, 6, 22], [0, 0, 30], [28, 6, 22]].forEach(([dx, dy, r]) => { c.beginPath(); c.arc(x + dx, y + dy, r, 0, TAU); c.fill(); }); }
  c.fillStyle = '#7bd389'; c.fillRect(0, 330, W, 30);
  const s = Math.sin(TAU * t * 2), a = s * 0.32;
  const hx = 180 + s * 16, hy = 132 - Math.abs(Math.cos(TAU * t * 2)) * 10;
  c.lineCap = 'round';
  for (const d of [-1, 1]) {
    const ang = d * (0.65 + 0.4 * Math.sin(TAU * t * 2 + (d > 0 ? Math.PI : 0)));
    const sx = 180 + d * 72, sy = 274, ex = sx + Math.sin(ang) * 72, ey = sy + Math.cos(ang) * 72;
    c.strokeStyle = '#1a1423'; c.lineWidth = 28; line(c, sx, sy, ex, ey);
    c.strokeStyle = '#ff5a7a'; c.lineWidth = 19; line(c, sx, sy, ex, ey);
    c.fillStyle = '#f6c48f'; c.lineWidth = 4; c.strokeStyle = '#1a1423'; c.beginPath(); c.arc(ex, ey, 14, 0, TAU); c.fill(); c.stroke();
  }
  c.fillStyle = '#ff5a7a'; c.strokeStyle = '#1a1423'; c.lineWidth = 5;
  roundRect(c, 102, 250, 156, 150, 44); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.font = '28px Anton, Impact, sans-serif'; c.textAlign = 'center'; c.fillText('#1', 180, 310);
  // spring neck
  const bx = 180, by = 254, tx = hx, ty = hy + 92, n = 9;
  c.strokeStyle = '#555'; c.lineWidth = 6; c.lineJoin = 'round'; c.beginPath(); c.moveTo(bx, by);
  for (let i = 1; i <= n; i++) { const k = i / n, px = bx + (tx - bx) * k, py = by + (ty - by) * k; c.lineTo(px + (i === n ? 0 : (i % 2 ? 14 : -14)), py); }
  c.stroke();
  drawFace(c, hx, hy, 214, a);
}},
{ id: 'shades', name: 'Deal With It', e: '😎', frames: 40, draw(c, t) {
  c.fillStyle = '#36c5c0'; c.fillRect(0, 0, W, W);
  c.fillStyle = 'rgba(255,255,255,.18)';
  for (let i = 0; i < 6; i++) c.fillRect(0, i * 64 + 20, W, 26);
  const h = 290, cy = 182; drawFace(c, 180, cy, h);
  const gw = 0.68 * h, p = gw / 24, eyePx = cy - h / 2 + st.eye * h;
  const final = eyePx - 2.3 * p, k = Math.min(1, t / 0.5);
  const y = -6 * p + (final + 6 * p) * k, x = 180 - gw / 2;
  c.fillStyle = '#000'; c.fillRect(x, y, gw, p + .5);
  const rows = [[1, 1, 10], [2, 1, 10], [3, 2, 9], [4, 3, 8]];
  for (const [r, a, b] of rows) for (const off of [0, 12]) c.fillRect(x + (a + off) * p, y + r * p, (b - a + 1) * p + .5, p + .5);
  c.fillStyle = '#fff';
  for (const [r, col] of [[1, 3], [1, 4], [2, 2], [2, 3]]) for (const off of [0, 12]) c.fillRect(x + (col + off) * p, y + r * p, p + .5, p + .5);
  return t > 0.6 ? { bottom: 'Deal with it' } : {};
}},
{ id: 'spin', name: 'Spin Cycle', e: '🌀', frames: 30, draw(c, t) {
  c.fillStyle = '#ffd23f'; c.fillRect(0, 0, W, W);
  c.save(); c.translate(180, 180); c.rotate(t * TAU / 8); c.fillStyle = '#ff8a3d';
  for (let i = 0; i < 8; i++) { c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 400, i * TAU / 8, i * TAU / 8 + TAU / 16); c.closePath(); c.fill(); }
  c.restore();
  drawFace(c, 180, 180, 230 * (1 + 0.13 * Math.sin(TAU * t * 4)), t * TAU * 2);
}},
{ id: 'zoom', name: 'Dramatic Zoom', e: '😱', frames: 36, draw(c, t, f) {
  const stage = Math.min(3, Math.floor(t * 4)), s = [1, 1.7, 2.6, 3.7][stage];
  c.fillStyle = '#111'; c.fillRect(0, 0, W, W);
  const h = 300, fy = 180 - h / 2 + st.eye * h, amp = [0, 2, 5, 9][stage];
  const dx = (rnd(f) - .5) * 2 * amp, dy = (rnd(f + .5) - .5) * 2 * amp;
  c.save(); c.translate(180 + dx, 180 + dy); c.scale(s, s); c.translate(-180, -fy + (stage ? 0 : 20)); drawFace(c, 180, 180, h); c.restore();
  const g = c.createRadialGradient(180, 180, 90, 180, 180, 260); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.85)');
  c.fillStyle = g; c.fillRect(0, 0, W, W);
  if (stage === 3) { c.fillStyle = 'rgba(210,0,0,.28)'; c.fillRect(0, 0, W, W); }
  return { top: ['', 'Dun', 'Dun dun', 'Dun dun DUNNN'][stage] };
}},
{ id: 'disco', name: 'Disco Bounce', e: '🪩', frames: 32, draw(c, t) {
  const beat = Math.floor(t * 8), cols = ['#ff4f8b', '#ffd23f', '#2ec4b6', '#7b5cff', '#ff8a3d'], n = 6, s = W / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    c.globalAlpha = (i + j + beat) % 2 ? 1 : .55; c.fillStyle = cols[(i * 2 + j * 3 + beat) % 5];
    c.fillRect(i * s, j * s, s + 1, s + 1);
  }
  c.globalAlpha = 1;
  const g = c.createRadialGradient(180, 200, 40, 180, 200, 260); g.addColorStop(0, 'rgba(20,0,40,0)'); g.addColorStop(1, 'rgba(20,0,40,.6)');
  c.fillStyle = g; c.fillRect(0, 0, W, W);
  for (let i = 0; i < 10; i++) {
    const a = Math.max(0, Math.sin(TAU * (t * 2 + rnd(i + 9)))); if (!a) continue;
    const x = 20 + rnd(i) * 320, y = 20 + rnd(i + 3) * 200, r = (8 + rnd(i + 5) * 10) * a;

  const lz = lzw(idx), nb = Math.ceil(lz.length / 255);
  const head = [0x21, 0xF9, 4, 0x04, delay & 255, delay >> 8, 0, 0, 0x2C, 0, 0, 0, 0, W & 255, W >> 8, W & 255, W >> 8, 0, 8];
  const out = new Uint8Array(head.length + lz.length + nb + 1); out.set(head); let o = head.length;
  for (let i = 0; i < lz.length; i += 255) { const n = Math.min(255, lz.length - i); out[o++] = n; for (let j = 0; j < n; j++) out[o++] = lz[i + j]; }
  out[o] = 0; return out;
}
const tick = () => new Promise(r => setTimeout(r, 0));

const makeBtn = $('make'), prog = $('prog'), bar = prog.firstElementChild;
let lastBlob = null, lastUrl = null;
const setProg = v => { bar.style.width = (v * 100).toFixed(1) + '%'; };
makeBtn.onclick = async () => {
  makeBtn.disabled = true; makeBtn.textContent = '🧪 Cooking…'; prog.style.display = 'block'; setProg(0);
  try {
    await fontsReady;
    const tp = cur, N = tp.frames, delay = delayCs();
    const cv = document.createElement('canvas'); cv.width = cv.height = W;
    const c = cv.getContext('2d', { willReadFrequently: true });
    const frames = [], hist = new Uint32Array(32768);
    for (let i = 0; i < N; i++) {
      c.clearRect(0, 0, W, W); render(c, i / N, tp);
      const d = c.getImageData(0, 0, W, W).data; frames.push(d);
      for (let p = 0; p < d.length; p += 8) hist[((d[p] >> 3) << 10) | ((d[p + 1] >> 3) << 5) | (d[p + 2] >> 3)]++;
      setProg(i / N * 0.25); if (i % 4 === 3) await tick();
    }
    const pal = medianCut(hist, 256), np = pal.length;
    const lut = new Int16Array(32768).fill(-1);
    const near = k => {
      const r = (k >> 10) * 255 / 31, g = ((k >> 5) & 31) * 255 / 31, b = (k & 31) * 255 / 31;
      let best = 0, bd = Infinity;
      for (let i = 0; i < np; i++) { const p = pal[i], dr = p[0] - r, dg = p[1] - g, db = p[2] - b, dd = dr * dr * 2 + dg * dg * 4 + db * db * 3; if (dd < bd) { bd = dd; best = i; } }
      return lut[k] = best;
    };
    const parts = [gifHeader(pal)];
    for (let i = 0; i < N; i++) {
      const d = frames[i], idx = new Uint8Array(W * W);
      for (let p = 0, q = 0; q < idx.length; p += 4, q++) {
        const k = ((d[p] >> 3) << 10) | ((d[p + 1] >> 3) << 5) | (d[p + 2] >> 3);
        const v = lut[k]; idx[q] = v >= 0 ? v : near(k);
      }
      parts.push(frameBytes(idx, delay));
      setProg(0.25 + (i + 1) / N * 0.75); await tick();
    }
    parts.push(new Uint8Array([0x3B]));
    lastBlob = new Blob(parts, { type: 'image/gif' });
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(lastBlob);
    $('out').src = lastUrl; $('result').style.display = 'block';
    $('savehint').textContent = downloads ? `${(lastBlob.size / 1024 / 1024).toFixed(1)} MB · ${N} frames` : fallbackHint;
    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (e) {
    $('savehint').textContent = 'Something went wrong making the GIF — try again.'; $('result').style.display = 'block';
  }
  prog.style.display = 'none'; makeBtn.disabled = false; makeBtn.textContent = '✨ Make it again';
};

/* ---------- saving ---------- */
const fallbackHint = 'To save: press and hold the GIF (or right-click it) and choose Save Image.';
let downloads = null;
// On a normal website (top-level page, no Claude host) plain downloads + native share work.
const standalone = window.top === window && !window.claude;
if (standalone) {
  downloads = { save: async ({ filename, data }) => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(data); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    return { status: 'saved' };
  } };
  $('save').hidden = false;
  try {
    if (navigator.canShare && navigator.canShare({ files: [new File([new Uint8Array(1)], 'x.gif', { type: 'image/gif' })] })) {
      const sb = $('share'); sb.hidden = false;
      sb.onclick = async () => {
        if (!lastBlob) return;
        try { await navigator.share({ files: [new File([lastBlob], `big-head-${cur.id}.gif`, { type: 'image/gif' })] }); } catch (e) {}
      };
    }
  } catch (e) {}
} else (async () => {
  for (let i = 0; i < 40 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 250));
  if (window.claude && window.claude.use) { try { downloads = await window.claude.use('downloads'); } catch (e) { downloads = null; } }
  $('save').hidden = !downloads;
  if (lastBlob && !downloads) $('savehint').textContent = fallbackHint;
})();
$('save').onclick = async () => {
  if (!downloads || !lastBlob) return;
  try {
    await downloads.save({ filename: `big-head-${cur.id}.gif`, data: lastBlob });
    $('savehint').textContent = 'Saved! Now go drop it in the group chat.';
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') return;
    if (code === 'rate_limited') { $('savehint').textContent = 'One sec — try that again.'; return; }
    $('save').hidden = true; $('savehint').textContent = fallbackHint;
  }
};

/* ---------- boot ---------- */
const fontsReady = (document.fonts ? Promise.all([document.fonts.load('48px Anton'), document.fonts.load('600 24px "Bricolage Grotesque"')]) : Promise.resolve()).catch(() => {});
refresh();
fontsReady.then(() => { drawEditor(); lastKey = ''; });
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
